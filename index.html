<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17643A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plan Futbol">
<meta name="description" content="Plan de pliometría, velocidad y resistencia para futbol, de lunes a sábado, pensado para el partido del domingo.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Plan Futbol</title>
<style>
/* Tipografías incluidas en el proyecto (licencia SIL OFL): funcionan sin internet */
@font-face{font-family:'Big Shoulders Display';font-weight:800;font-display:swap;src:url(bsd-800.woff2) format('woff2')}
@font-face{font-family:'Big Shoulders Display';font-weight:900;font-display:swap;src:url(bsd-900.woff2) format('woff2')}
@font-face{font-family:'Atkinson Hyperlegible';font-weight:400;font-display:swap;src:url(ah-400.woff2) format('woff2')}
@font-face{font-family:'Atkinson Hyperlegible';font-weight:700;font-display:swap;src:url(ah-700.woff2) format('woff2')}
:root{
  --pitch:#17643A; --pitch-dk:#0E4526; --pitch-lt:#E2EFE5;
  --chalk:#FFFFFF; --bg:#EDF2EE; --panel:#FFFFFF;
  --ink:#14231A; --ink-2:#3B4D42; --muted:#5F6F65; --line:#D2DCD5;
  --bib:#FF7A1F; --bib-ink:#6E2C00; --bib-lt:#FFE8D6;
  --warn-lt:#FFF3CC; --warn-ink:#5A4100;
  --stop:#C8202F; --stop-lt:#FCE3E5; --stop-ink:#760E17;
  --r:14px;
  --disp:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --tabh:64px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);
  padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 28px)}
button{font:inherit;color:inherit}
a{color:var(--pitch)}
:focus-visible{outline:3px solid var(--bib);outline-offset:2px}
[hidden]{display:none!important}
body.timing{padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 110px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Cancha (encabezado) ---------- */
.pitch{position:relative;overflow:hidden;color:var(--chalk);
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 46px,transparent 46px 92px),var(--pitch);
  padding-top:env(safe-area-inset-top)}
.pitch::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.42;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 260 260'><g fill='none' stroke='white' stroke-width='3'><circle cx='130' cy='130' r='86'/><line x1='130' y1='-10' x2='130' y2='270'/></g><circle cx='130' cy='130' r='5' fill='white'/></svg>") no-repeat right -96px top -34px/270px}
.head{position:relative;max-width:560px;margin:0 auto;padding:16px 16px 12px}
.dorsal{position:absolute;right:10px;top:-14px;font:900 170px/1 var(--disp);letter-spacing:-3px;
  color:rgba(255,255,255,.13);pointer-events:none;user-select:none}
@supports (-webkit-text-stroke:2px white){.dorsal{color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.55)}}
.team{font-weight:700;font-size:15px;opacity:.85;margin:0}
.who{display:block;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--chalk);position:relative}
.who-name{display:block;font:800 46px/.95 var(--disp);margin-top:4px;max-width:70%;overflow-wrap:anywhere}
.who-meta{display:block;font-size:15px;opacity:.92;margin-top:4px}
.who-meta u{text-decoration-thickness:1px;text-underline-offset:3px}
.wkline{display:flex;align-items:center;gap:8px;margin-top:12px;position:relative}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700;background:rgba(255,255,255,.15);border:0;color:var(--chalk)}
.pill.bib{background:var(--bib);color:#2B1000}
.wk-txt{display:flex;flex-direction:column;line-height:1.15;min-width:0;padding:0 4px}
.wk-txt b{font:800 23px/1 var(--disp)}
.wk-txt span{font-size:14px;opacity:.92}
.navbtn{width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:var(--chalk);cursor:pointer;display:grid;place-items:center;padding:0}
.navbtn svg{width:18px;height:18px}
.pill.link{cursor:pointer;margin-left:auto;white-space:nowrap}
.days{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:560px;margin:0 auto;padding:4px 12px 14px}
.day{border:0;border-radius:10px;padding:8px 1px 6px;background:rgba(255,255,255,.1);color:var(--chalk);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;min-height:66px;position:relative}
.day b{font:800 19px/1 var(--disp)}
.day small{font-size:10.5px;line-height:1.1;opacity:.88}
.day .dk{width:16px;height:16px;border-radius:50%;display:grid;place-items:center}
.day .dk svg{width:12px;height:12px}
.day.done .dk{background:var(--chalk)}
.day.done .dk svg{stroke:var(--pitch)}
.day[aria-current="true"]{background:var(--chalk);color:var(--pitch-dk)}
.day[aria-current="true"].done .dk{background:var(--pitch)}
.day[aria-current="true"].done .dk svg{stroke:#fff}
.day.today::after{content:"";position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--bib)}

/* ---------- Contenido ---------- */
main{max-width:560px;margin:0 auto;padding:18px 16px 0}
.date{color:var(--muted);font-size:15px;margin:0}
h1.title{font:800 40px/1 var(--disp);margin:2px 0 8px;letter-spacing:.2px}
.goal{margin:0 0 12px;color:var(--ink-2)}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700;color:var(--ink-2)}
button.chip{cursor:pointer;min-height:36px}
button.chip[aria-pressed="true"]{border-color:var(--pitch);background:var(--pitch-lt);color:var(--pitch-dk)}
.notice{border-radius:12px;padding:12px 14px;margin:0 0 14px;background:var(--warn-lt);color:var(--warn-ink)}
.notice.green{background:var(--pitch-lt);color:var(--pitch-dk)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 16px}
.panel h2,.block h2,.sec h2{font:800 25px/1.05 var(--disp);margin:0 0 8px}
.panel p:last-child{margin-bottom:0}
.q{font-weight:700;font-size:15px;margin:10px 0 4px}
.q:first-of-type{margin-top:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 4px;font-size:14px;line-height:1.2;cursor:pointer;min-height:46px}
.seg button[aria-pressed="true"]{border-color:var(--pitch);background:var(--pitch-lt);font-weight:700;color:var(--pitch-dk)}
.seg button.b1[aria-pressed="true"]{border-color:#C79A00;background:var(--warn-lt);color:var(--warn-ink)}
.seg button.b2[aria-pressed="true"]{border-color:var(--stop);background:var(--stop-lt);color:var(--stop-ink)}
.verdict{border-radius:10px;padding:10px 12px;margin-top:12px;font-weight:700}
.v-ok{background:var(--pitch-lt);color:var(--pitch-dk)}
.v-warn{background:var(--warn-lt);color:var(--warn-ink)}
.v-stop{background:var(--stop-lt);color:var(--stop-ink)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 2px;cursor:pointer}
.switch span b{display:block}
.switch span small{color:var(--muted);font-size:14px}
.switch input{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:999px;background:#C5D0C8;position:relative;flex:none;cursor:pointer;margin:0;transition:background .18s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .18s}
.switch input:checked{background:var(--pitch)}
.switch input:checked::after{transform:translateX(20px)}

.block{margin:0 0 18px}
.block h2 small{font:400 14px var(--body);color:var(--muted);margin-left:6px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{padding:14px;border-top:1px solid var(--line);position:relative}
.item:first-child{border-top:0}
.item.done{background:linear-gradient(90deg,var(--pitch) 0 4px,transparent 4px)}
.ex-name{background:none;border:0;padding:0;text-align:left;font-weight:700;font-size:17px;line-height:1.3;cursor:pointer;
  text-decoration:underline;text-decoration-color:#AFC0B4;text-decoration-thickness:2px;text-underline-offset:4px}
.opt-tag{font-size:13px;color:var(--muted)}
.rx{color:var(--ink-2);margin-top:3px}
.lv{display:inline-block;font-size:13px;font-weight:700;background:var(--pitch-lt);color:var(--pitch-dk);border-radius:6px;padding:1px 8px;margin-left:4px}
.alt{font-size:14px;color:var(--muted);margin-top:4px}
.boxes{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.box{width:42px;height:42px;border-radius:9px;border:2px solid #9AAEA1;background:#fff;cursor:pointer;display:grid;place-items:center;padding:0}
.box svg{width:22px;height:22px;opacity:0}
.box[aria-pressed="true"]{background:var(--pitch);border-color:var(--pitch)}
.box[aria-pressed="true"] svg{opacity:1}
.rest{margin-left:auto;border:0;background:var(--bib-lt);color:var(--bib-ink);border-radius:999px;padding:8px 13px;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;min-height:42px}
.rest svg{width:16px;height:16px}

.finish{background:var(--pitch-dk);color:var(--chalk);border-radius:var(--r);padding:16px;margin:22px 0 10px}
.finish h2{font:800 28px/1 var(--disp);margin:0 0 4px}
.finish p{margin:0 0 12px;opacity:.9}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rpe button{aspect-ratio:1/1.15;border:0;border-radius:8px;background:rgba(255,255,255,.13);color:#fff;font:800 20px var(--disp);cursor:pointer;padding:0}
.rpe button[aria-pressed="true"]{background:var(--bib);color:#2B1000}
.rpe-txt{min-height:24px;margin:8px 0 2px;font-size:15px}
.finish .field span{color:var(--chalk)}
.finish input,.finish textarea{border-color:transparent}
.saved{font-size:14px;margin-top:10px;opacity:.9}

.field{display:block;margin:12px 0}
.field>span{display:block;font-size:14px;font-weight:700;margin-bottom:5px}
input[type=number],input[type=text],input[type=date],input[type=url],input[type=search],textarea,select{
  width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink);min-height:46px}
textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-size:16px;cursor:pointer;min-height:50px;background:var(--pitch);color:#fff;text-decoration:none;text-align:center}
.btn.bib{background:var(--bib);color:#2B1000}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--stop-lt);color:var(--stop-ink)}
.btn.full{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns .btn{flex:1 1 140px}

/* ---------- Alta de jugador ---------- */
.setup-head .head{padding-bottom:22px}
.setup-head h1{font:900 54px/.92 var(--disp);margin:6px 0 8px;max-width:9ch}
.setup-head p{margin:0;max-width:34ch;opacity:.92}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice.one{grid-template-columns:1fr}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:left;cursor:pointer;min-height:52px}
.opt b{display:block}
.opt span{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.opt[aria-pressed="true"]{border-color:var(--pitch);background:var(--pitch-lt);box-shadow:inset 0 0 0 1px var(--pitch)}
.err{color:var(--stop-ink);font-weight:700;margin:10px 0 0}

/* ---------- Progreso ---------- */
.big{font:800 34px/1 var(--disp)}
.sum{font-size:18px;line-height:1.45;margin:0 0 6px}
.sum b{font:800 26px/1 var(--disp)}
.cyc-row{display:grid;grid-template-columns:40px repeat(7,1fr);gap:5px;align-items:center;margin:4px 0}
.cyc-row.hd span{font-size:12px;color:var(--muted);text-align:center}
.cyc-row .wl{font-size:13px;font-weight:700;color:var(--ink-2)}
.cell{aspect-ratio:1;border-radius:8px;border:2px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.cell svg{width:14px;height:14px}
.cell.done{background:var(--pitch);border-color:var(--pitch)}
.cell.part{background:linear-gradient(135deg,var(--pitch-lt) 50%,#fff 50%);border-color:var(--pitch)}
.cell.miss{border-style:dashed;border-color:#AEBDB3}
.cell.fut{opacity:.5}
.cell.today{outline:3px solid var(--bib);outline-offset:1px}
.cell.cur-wk{}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;border:2px solid var(--line);vertical-align:-2px;margin-right:5px}
.legend .l-done{background:var(--pitch);border-color:var(--pitch)}
.legend .l-part{background:linear-gradient(135deg,var(--pitch-lt) 50%,#fff 50%);border-color:var(--pitch)}
.legend .l-miss{border-style:dashed;border-color:#AEBDB3}
table.t{width:100%;border-collapse:collapse}
.t th,.t td{padding:9px 6px;border-top:1px solid var(--line);text-align:left;font-size:15px;vertical-align:middle}
.t thead th{border-top:0;font-size:13px;color:var(--muted);font-weight:700}
.t input{min-height:42px;padding:6px 8px;max-width:88px}
.t .how{background:none;border:0;padding:0;font-weight:700;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:#AFC0B4;text-underline-offset:3px}
.t small{color:var(--muted)}
.delta{font-weight:700}
.test{border-top:1px solid var(--line);padding:12px 0}
.test:first-child{border-top:0;padding-top:4px}
.test small{color:var(--muted)}
.test .how{background:none;border:0;padding:0;font-weight:700;font-size:17px;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:#AFC0B4;text-decoration-thickness:2px;text-underline-offset:4px}
.test-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end;margin-top:8px}
.test-row label span{display:block;font-size:13px;color:var(--muted);font-weight:700;margin-bottom:3px}
.delta-cell{padding-bottom:11px;font-size:15px;line-height:1.2}
.delta.good{color:var(--pitch)}
.delta.bad{color:var(--stop)}
.hist{list-style:none;margin:0;padding:0}
.hist li{border-top:1px solid var(--line)}
.hist li:first-child{border-top:0}
.hist button{display:flex;justify-content:space-between;gap:12px;width:100%;background:none;border:0;padding:10px 0;text-align:left;cursor:pointer}
.hist small{color:var(--muted);display:block}
.hist .ld{font:800 20px var(--disp);white-space:nowrap}

/* ---------- Equipo ---------- */
.share-box{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:12px;font-size:15px}
.board .me{background:var(--pitch-lt)}
.board td:first-child{font:800 20px var(--disp);width:34px}

/* ---------- Guía ---------- */
.sec{margin:0 0 12px}
details.panel{padding:0}
details.panel>summary{list-style:none;cursor:pointer;padding:14px 44px 14px 14px;position:relative;font:800 24px/1.1 var(--disp)}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::after{content:"";position:absolute;right:16px;top:50%;width:10px;height:10px;border-right:3px solid var(--ink-2);border-bottom:3px solid var(--ink-2);transform:translateY(-70%) rotate(45deg);transition:transform .15s}
details.panel[open]>summary::after{transform:translateY(-30%) rotate(-135deg)}
.dbody{padding:0 14px 14px}
.dbody ul,.dbody ol{padding-left:20px;margin:6px 0}
.dbody li{margin:5px 0}
.week-list{list-style:none;padding:0!important}
.week-list li{display:grid;grid-template-columns:62px 1fr;gap:10px;border-top:1px solid var(--line);padding:9px 0;margin:0!important}
.week-list li:first-child{border-top:0}
.week-list b{font:800 20px/1.1 var(--disp)}
.gl dt{font-weight:700;margin-top:10px}
.gl dd{margin:2px 0 0}
.rpe-t td{padding:5px 6px}
.lib-list{list-style:none;padding:0!important;margin:10px 0 0!important}
.lib-list li{border-top:1px solid var(--line);margin:0!important}
.lib-list button{width:100%;text-align:left;background:none;border:0;padding:10px 0;cursor:pointer}
.lib-list button small{display:block;color:var(--muted)}
.src{font-size:14px}
.src li{margin:7px 0}

/* ---------- Barra de pestañas ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;color:var(--muted);cursor:pointer;min-height:var(--tabh)}
.tab svg{width:25px;height:25px}
.tab[aria-current="page"]{color:var(--pitch);font-weight:700}

/* ---------- Reloj de descanso ---------- */
#timer{position:fixed;left:12px;right:12px;z-index:30;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 10px);
  max-width:536px;margin:0 auto;background:var(--bib);color:#2B1000;border-radius:16px;padding:10px 10px 10px 16px;
  display:flex;align-items:center;gap:10px;box-shadow:0 10px 28px rgba(20,35,26,.25)}
#t-num{font:900 42px/1 var(--disp);min-width:84px;font-variant-numeric:tabular-nums}
#t-lab{font-size:13px;font-weight:700;display:block}
#t-bar{height:6px;background:rgba(0,0,0,.15);border-radius:3px;overflow:hidden;margin-top:4px}
#t-bar i{display:block;height:100%;background:#2B1000;width:100%}
#timer .grow{flex:1;min-width:0}
#timer button{border:0;border-radius:10px;background:rgba(0,0,0,.12);color:#2B1000;font-weight:700;padding:0 12px;min-height:44px;cursor:pointer}
#timer.fin{background:var(--pitch);color:#fff}
#timer.fin button{color:#fff;background:rgba(255,255,255,.18)}
#timer.fin #t-bar i{background:#fff}

/* ---------- Hoja inferior ---------- */
#sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,28,16,.5)}
.sheet-in{background:#fff;width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;
  padding:18px 18px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sheet-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-in h2{font:800 32px/1 var(--disp);margin:0 0 6px}
.x{border:0;background:var(--bg);width:44px;height:44px;border-radius:50%;cursor:pointer;flex:none;display:grid;place-items:center}
.x svg{width:20px;height:20px}
.lead{color:var(--ink-2);margin:4px 0 10px}
.steps{padding-left:22px;margin:8px 0}
.steps li{margin:7px 0}
.callout{border-left:4px solid var(--stop);background:var(--stop-lt);padding:10px 12px;border-radius:0 10px 10px 0;margin:12px 0}
.callout.easy{border-color:var(--pitch);background:var(--pitch-lt)}
.callout.hard{border-color:var(--bib);background:var(--bib-lt)}
.callout b{display:block}
.pf-list{list-style:none;padding:0;margin:8px 0 14px}
.pf-list li{margin:6px 0}

#toast{position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 16px);transform:translate(-50%,16px);
  background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:700px){.who-name{font-size:56px}.dorsal{font-size:200px}}
</style>
</head>
<body>
<div id="app"></div>

<div id="timer" hidden role="timer" aria-live="off">
  <div id="t-num">0:00</div>

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate()+n); return x; };
const monday = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; };
const todayISO = () => iso(new Date());

const shortDate = ds => parse(ds).toLocaleDateString('es-MX',{day:'numeric', month:'short'}).replace('.','');

function getLog(p, ds, create){
  if (!p.logs[ds] && create) p.logs[ds] = {done:{}, ready:{}, light:false, comp:false, rpe:null, min:null, note:'', completed:false};
  return p.logs[ds] || null;
}
function weekInfo(p, ds){
  const days = Math.round((monday(parse(ds)) - monday(parse(p.start))) / 864e5);
  const abs = Math.floor(days/7) + 1;
  if (abs < 1) return {abs, before:true, cw:1, cycle:1, W:WEEKS[0]};
  const cw = ((abs-1) % 8) + 1;
  return {abs, before:false, cw, cycle:Math.ceil(abs/8), W:WEEKS[cw-1]};
}

/* Prescripción de un ejercicio para este jugador, esta semana */
function rx(it, p, wk, light, fixBlock){
  const li = LEVELS[p.level].i;
  let exId = it.ex, pi = 0;
  if (wk.W.ph === 2 && it.ex2){ exId = it.ex2; pi = 1; }
  if (p.low && it.low){ exId = it.low; pi = 0; }
  let sets = it.s ? it.s[li] : 1;
  if (it.s && !fixBlock){
    sets = Math.max(1, Math.round(sets * wk.W.f));
    if (light) sets = Math.max(1, Math.ceil(sets * .5));
  }
  const pick = v => Array.isArray(v) ? v[pi] : v;
  const r = pick(it.r), n = pick(it.n) || 0, side = !!pick(it.side);
  let text;
  if (it.unit === 'rep') text = `${sets} ${sets===1?'repetición':'repeticiones'} ${r||''}`.trim();
  else if (it.unit === 'serie') text = `${sets} ${sets===1?'serie':'series'} ${r||''}`.trim();
  else if (!it.s) text = r;
  else text = `${sets} × ${r}`;
  return {exId, sets, text, contacts: n ? sets*n*(side?2:1) : 0, rest:it.rest||'', rs:it.rs||0,
    lv: it.lv ? it.lv[li] : '', opt:!!it.opt};
}

/* El plan de un día, ya ajustado */
function dayPlan(p, ds){
  const dow = parse(ds).getDay(), D = DAYS[dow], wk = weekInfo(p, ds);
  const L = p.logs[ds] || {done:{}, ready:{}};
  const light = !!L.light;
  const blocks = [];
  const mk = (it, key, fix) => { const R = rx(it, p, wk, light, fix); return {key, R, E:EX[R.exId]}; };
  D.blocks.forEach((b, bi) => {
    if (b.test && !wk.W.test) return;
    if (b.info){ blocks.push({t:b.t, info:b.info}); return; }
    if (b.pos){ blocks.push({t:'Tu posición', sub:POS[p.pos].n, items:[mk(POSD[p.pos][b.pos], `p${bi}`, false)]}); return; }
    blocks.push({t:b.t, items:b.items.map((it, ii) => mk(it, `${bi}-${ii}`, !!b.fix))});
  });
  if (dow === 1 && L.comp) blocks.splice(1, 0, {t:'Compensatorio', sub:'porque jugaste poco', items:D.comp.map((it, ii) => mk(it, `c-${ii}`, true))});
  let contacts = 0, total = 0, done = 0;
  blocks.forEach(b => (b.items||[]).forEach(x => {
    contacts += x.R.contacts; total += x.R.sets;
    const arr = (L.done && L.done[x.key]) || [];
    for (let i = 0; i < x.R.sets; i++) if (arr[i]) done++;
  }));
  return {D, dow, wk, L, light, blocks, contacts, total, done};
}

function readiness(r){
  if (!r) return null;
  const v = [r.sleep, r.legs, r.pain];
  if (v.some(x => x == null)) return null;
  if (r.pain === 2) return 'stop';
  if (r.sleep === 2 || r.legs === 2 || (r.sleep + r.legs + r.pain) >= 3) return 'warn';
  return 'ok';
}

}

function weekStats(p, mon){
  let ses = 0, load = 0, matchMin = 0, match = false;
  for (let i = 0; i < 7; i++){
    const ds = iso(addDays(mon, i)), L = p.logs[ds];
    if (!L || !L.completed) continue;
    if (i === 6){ match = true; matchMin += Number(L.min)||0; } else ses++;
    load += (Number(L.rpe)||0) * (Number(L.min)||0);
  }
  return {ses, load, matchMin, match};
}

function viewProg(p){
  const t = todayISO(), wk = weekInfo(p, t);
  const mon = monday(new Date());
  const st = weekStats(p, mon), prev = weekStats(p, addDays(mon, -7));
  let h = `<h1 class="title">Tu progreso</h1>`;
  h += `<section class="panel"><p class="sum">Esta semana llevas <b>${st.ses} de 6</b> sesiones${st.match?` y el partido (${st.matchMin} min)`:''}.</p>
    <p class="sum">Carga: <b>${num(st.load)}</b> <small>(esfuerzo × minutos)</small>. La semana pasada: ${num(prev.load)}.</p>
    ${prev.load && st.load > prev.load*1.3 ? '<p class="notice" style="margin:8px 0 0">Subiste más de 30% contra la semana pasada. Si sientes las piernas pesadas, usa la versión ligera unos días.</p>' : ''}</section>`;

  // ciclo
  const cyc = wk.before ? 1 : wk.cycle;
  const startMon = addDays(monday(parse(p.start)), (cyc-1)*56);
  let g = `<div class="cyc-row hd"><span></span>${ORDER.map(d => `<span>${SHORT[d]}</span>`).join('')}</div>`;
  for (let w = 0; w < 8; w++){
    g += `<div class="cyc-row"><span class="wl">S${(cyc-1)*8+w+1}</span>`;
    for (let i = 0; i < 7; i++){
      const ds = iso(addDays(startMon, w*7+i)), L = p.logs[ds];
      let cls = 'fut', lab = 'pendiente';
      if (L && L.completed){ cls = 'done'; lab = i===6 ? 'partido registrado' : 'hecha'; }
      else if (L && Object.values(L.done||{}).some(a => (a||[]).some(Boolean))){ cls = 'part'; lab = 'a medias'; }
      else if (ds < t){ cls = 'miss'; lab = 'sin registrar'; }
      const name = DAYS[ORDER[i]].name;
      g += `<button class="cell ${cls}${ds===t?' today':''}" data-a="day" data-d="${ds}" title="${name} ${shortDate(ds)}: ${lab}" aria-label="${name} ${shortDate(ds)}: ${lab}">${cls==='done'?I.check:''}</button>`;
    }
    g += `</div>`;
  }
  h += `<section class="panel"><h2>Ciclo ${cyc}</h2>${g}
    <div class="legend"><span><i class="l-done"></i>Hecha</span><span><i class="l-part"></i>A medias</span><span><i class="l-miss"></i>Sin registrar</span><span><i></i>Pendiente</span></div></section>`;

  // pruebas
  const T = (p.tests && p.tests['c'+cyc]) || {};
  const rows = TESTS.map(x => {
    const a = T.s1 && T.s1[x.id], b = T.s8 && T.s8[x.id];
    let d = '';
    if (a && b){
      const diff = +(b - a).toFixed(2), good = x.up ? diff > 0 : diff < 0;
      d = `<span class="delta ${diff===0?'':good?'good':'bad'}">${diff>0?'+':''}${diff} ${x.u}${diff===0?'':good?' mejor':' peor'}</span>`;
    }
    const w1 = (cyc-1)*8+1, w8 = (cyc-1)*8+8;
    const inp = (col, v, w) => `<label><span>Semana ${w}</span><input type="number" inputmode="decimal" step="0.01" data-test="${x.id}" data-col="${col}" value="${v==null?'':v}" aria-label="${x.n}, semana ${w}, en ${x.u}"></label>`;
    return `<div class="test"><button class="how" data-a="ex" data-id="${x.how}">${esc(x.n)}</button> <small>${x.u}, ${x.up?'más es mejor':'menos es mejor'}</small>
      <div class="test-row">${inp('s1', a, w1)}${inp('s8', b, w8)}<div class="delta-cell">${d}</div></div></div>`;
  }).join('');
  h += `<section class="panel" id="tests"><h2>Pruebas</h2><p>Se hacen el miércoles de la semana ${(cyc-1)*8+1} y de la semana ${(cyc-1)*8+8}. Toca el nombre de cada prueba para ver cómo medirla.</p>
    <div class="tests">${rows}</div></section>`;

  // historial
  const hist = Object.keys(p.logs).filter(k => p.logs[k].completed).sort().reverse().slice(0, 15);
  h += `<section class="panel"><h2>Historial</h2>${hist.length ? `<ul class="hist">${hist.map(ds => {
    const L = p.logs[ds], dw = parse(ds).getDay();
    return `<li><button data-a="day" data-d="${ds}"><span>${esc(DAYS[dw].title)}<small>${longDate(ds)}${L.rpe?`, esfuerzo ${L.rpe}`:''}${L.min?`, ${L.min} min`:''}${L.light?', ligera':''}</small></span>
      <span class="ld">${num((L.rpe||0)*(L.min||0))}</span></button></li>`; }).join('')}</ul>` :
    '<p>Aún no hay sesiones guardadas. Al terminar una, toca «Guardar sesión» en Hoy.</p>'}</section>`;
  return h;
}

function shareText(p){
  const mon = monday(new Date()), st = weekStats(p, mon), wk = weekInfo(p, todayISO());
  const lines = [`${CONFIG.TEAM_NAME}: ${p.name}${p.num?` #${p.num}`:''} (${POS[p.pos].n})`,
    `Semana ${wk.before?1:wk.abs}: ${st.ses} de 6 sesiones`, `Carga: ${num(st.load)}`];
  if (st.match) lines.push(`Partido: ${st.matchMin} min`);
  const T = p.tests && p.tests['c'+(wk.before?1:wk.cycle)];
  if (T && T.s1 && T.s1.cmj) lines.push(`Salto vertical: ${T.s8&&T.s8.cmj ? `${T.s1.cmj} → ${T.s8.cmj}` : T.s1.cmj} cm`);
  if (location.protocol.startsWith('http')) lines.push(`Plan: ${location.origin}${location.pathname}`);
  return lines.join('\n');
}

function viewGuide(){

  const lib = Object.entries(EX).filter(([k]) => !k.startsWith('tt_'))

  <details class="panel sec" open><summary>Así funciona tu semana</summary><div class="dbody">

  <details class="panel sec"><summary>Reglas para no lastimarte</summary><div class="dbody"><ul>
    <li><b>Para</b> si sientes dolor punzante, dolor en la articulación (rodilla, tobillo) al caer, o dolor que cambia tu forma de moverte.</li>

    <li>Aterriza en silencio: rodillas en línea con la punta de los pies, nunca hacia adentro; cadera atrás y pecho al frente.</li>
    <li>Calidad antes que cantidad. Si el salto pierde altura o el aterrizaje hace ruido, termina la serie.</li>

    <li>El sábado no pruebes nada nuevo.</li>
    <li>Esta guía no sustituye a un médico ni a un fisioterapeuta.</li></ul></div></details>

  <details class="panel sec"><summary>Cómo leer el plan</summary><div class="dbody"><dl class="gl">
    <dt>3 × 8 por pierna</dt><dd>3 series de 8 repeticiones con cada pierna. Cada cuadrito es una serie: márcalo al terminarla y arranca el descanso solo.</dd>
    <dt>Saltos</dt><dd>Cuántas veces tocas el piso saltando en la sesión. Así se controla la carga de la pliometría.</dd>

  <details class="panel sec"><summary>Por qué este plan</summary><div class="dbody"><ul>
    <li><b>Un día fuerte de saltos.</b> Una revisión de 90 estudios en futbolistas sugiere 1 o 2 sesiones por semana, con alrededor de 80 saltos de máxima calidad, durante al menos 7 semanas.</li>

    <li><b>Nórdico.</b> Los programas que lo incluyen reducen a la mitad las lesiones de isquios.</li>

    <ol class="src">
      <li><a href="https://www.ncbi.nlm.nih.gov/pmc/articles/PMC9230747/" target="_blank" rel="noopener">Programming Plyometric-Jump Training in Soccer: A Review (2022)</a></li>

      ${S.adding ? '<button class="btn ghost" data-a="cancel-setup">Cancelar</button>' : ''}</div>

}

function render(){
  const p = P(), app = $('#app');
  if (!p || S.adding){
    if (!S.setup) S.setup = newDraft();
    app.innerHTML = viewSetup();
    return;
  }
  let body;
  if (S.tab === 'hoy') body = viewHoy(p);
  else if (S.tab === 'progreso') body = viewProg(p);
  else if (S.tab === 'equipo') body = viewTeam(p);
  else body = viewGuide(p);
  app.innerHTML = header(p, S.tab === 'hoy') + `<main>${body}</main>` + tabs();
}

function closeSheet(){
  $('#sheet').hidden = true;
  document.body.style.overflow = '';
  S.delArm = false;
}

    <label class="field"><span>Empezaste la semana del</span><input type="date" id="pf-start" value="${esc(p.start)}"></label>

/* ===================== Acciones ===================== */
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2400); }

function createProfile(){
  const d = S.setup;
  if (!d.name.trim()) { S.err = 'Escribe tu nombre o apodo.'; return render(); }
  if (!d.pos) { S.err = 'Elige tu posición.'; return render(); }
  if (!d.level) { S.err = 'Elige tu nivel.'; return render(); }
  const id = uid();
  DB.profiles[id] = {id, name:d.name.trim(), num:String(d.num||'').slice(0,2), pos:d.pos, level:d.level, low:!!d.low,
    start: d.start || iso(monday(new Date())), created:Date.now(), logs:{}, tests:{}};
  DB.active = id; S.setup = null; S.adding = false; S.err = ''; S.tab = 'hoy'; S.sel = todayISO();
  save(); render(); scrollTo(0,0);
  toast(`Listo, ${DB.profiles[id].name}. Este es tu día de hoy.`);
}
function saveProfile(p){
  const name = $('#pf-name').value.trim();
  if (!name) return toast('El nombre no puede quedar vacío.');
  Object.assign(p, {name, num:String($('#pf-num').value||'').slice(0,2), pos:$('#pf-pos').value, level:$('#pf-level').value,
    start:$('#pf-start').value || p.start, low:$('#pf-low').checked});
  save(); closeSheet(); render(); toast('Perfil guardado');
}
function deleteProfile(p){
  delete DB.profiles[p.id];
  DB.active = Object.keys(DB.profiles)[0] || null;
  save(); closeSheet(); S.setup = null; render(); toast('Perfil borrado');
}

function toggleBox(p, btn){
  const L = getLog(p, S.sel, true), k = btn.dataset.k, i = +btn.dataset.i;
  const arr = L.done[k] || (L.done[k] = []);
  arr[i] = !arr[i];
  save();
  btn.setAttribute('aria-pressed', String(!!arr[i]));
  const item = btn.closest('.item');
  const all = [...item.querySelectorAll('.box')].every(b => b.getAttribute('aria-pressed') === 'true');
  item.classList.toggle('done', all);
  const c = $('#setcount');
  if (c){ const bx = [...document.querySelectorAll('main .box')]; c.textContent = `${bx.filter(b => b.getAttribute('aria-pressed')==='true').length} de ${bx.length} series`; }
  if (arr[i] && !all && btn.dataset.rs) startTimer(+btn.dataset.rs);
  if (arr[i] && all) stopTimer();
}
function setReady(p, f, v){
  const L = getLog(p, S.sel, true);
  L.ready = L.ready || {};
  L.ready[f] = L.ready[f] === v ? null : v;
  const r = readiness(L.ready);
  if ((r === 'warn' || r === 'stop') && !L.lightTouched) L.light = true;
  if (r === 'ok' && !L.lightTouched) L.light = false;
  save(); render();
}
function setRpe(p, v){
  const L = getLog(p, S.sel, true);
  L.rpe = v; save();
  document.querySelectorAll('.rpe button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.v === v)));
  const t = $('#rpe-txt'); if (t) t.textContent = `${v}: ${RPE_TXT[v]}`;
}
function saveSession(p, type){
  const L = getLog(p, S.sel, true), plan = dayPlan(p, S.sel);
  if (!L.rpe) return toast('Elige qué tan duro fue, del 1 al 10.');
  if (L.min == null || L.min === '') L.min = plan.D.match ? 90 : firstNum(plan.D.dur);
  L.completed = true; L.at = Date.now();
  save(); render();
  toast(type === 'partido' ? 'Partido guardado' : 'Sesión guardada');
  queue({id:p.id, jugador:p.name, dorsal:p.num||'', posicion:POS[p.pos].n, nivel:LEVELS[p.level].n,
    fecha:S.sel, tipo:type, dia:plan.D.name, semana:plan.wk.abs, rpe:L.rpe, minutos:L.min, carga:L.rpe*L.min,
    series_hechas:plan.done, series_total:plan.total, saltos:plan.contacts, ligera:L.light?'sí':'no'});
}
function setTest(p, id, col, val){
  const wk = weekInfo(p, todayISO()), c = 'c' + (wk.before ? 1 : wk.cycle);
  p.tests = p.tests || {};
  const T = p.tests[c] || (p.tests[c] = {});
  T[col] = T[col] || {};
  const v = parseFloat(String(val).replace(',', '.'));
  if (isNaN(v)) delete T[col][id]; else T[col][id] = v;
  save();
}

/* ----- Sincronización opcional con Google Sheets ----- */
function queue(item){
  if (!syncURL()) return;
  DB.sync.pending = DB.sync.pending.filter(x => !(x.id === item.id && x.fecha === item.fecha && x.tipo === item.tipo));
  DB.sync.pending.push(item); save(); flush();
}
let flushing = false;
async function flush(manual){
  const url = syncURL();
  if (!url || flushing || !DB.sync.pending.length) return;
  flushing = true;
  let sent = 0, fail = '';
  for (const item of [...DB.sync.pending]){
    try {
      const r = await fetch(url, {method:'POST', body:JSON.stringify(Object.assign({key:syncKey()}, item))});
      const j = await r.json();
      if (j.ok){ DB.sync.pending = DB.sync.pending.filter(x => x !== item); sent++; save(); }
      else { fail = j.error === 'clave' ? 'La clave del equipo no coincide.' : 'El tablero rechazó el registro.'; break; }
    } catch(e){ fail = 'Sin conexión con el tablero. Se subirá después.'; break; }
  }
  flushing = false;
  if (manual) toast(fail || `${sent} ${sent===1?'registro subido':'registros subidos'}`);
  if (S.tab === 'equipo'){ render(); if (sent) loadTeam(true); }
}
async function loadTeam(force){
  const url = syncURL(); if (!url) return;
  if (!force && S.team && Date.now() - S.teamAt < 60000) return;
  S.teamLoading = true;
  if (S.tab === 'equipo' && !S.team) render();
  try {
    const r = await fetch(`${url}?key=${encodeURIComponent(syncKey())}&semana=${iso(monday(new Date()))}`);
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    S.team = j.jugadores || []; S.teamAt = Date.now(); S.teamErr = '';
  } catch(e){ S.teamErr = 'No se pudo cargar el tablero. Revisa tu conexión, la URL o la clave.'; }
  S.teamLoading = false;
  if (S.tab === 'equipo') render();
}
function saveSyncCfg(){
  DB.sync.url = $('#sync-url').value.trim();
  DB.sync.key = $('#sync-key').value.trim();
  S.team = null; S.teamErr = '';
  save(); render(); toast('Conexión guardada'); loadTeam(true); flush();
}

/* ----- Compartir, respaldo ----- */
async function share(p, mode){
  const txt = shareText(p);
  if (mode === 'native' && navigator.share){ try { await navigator.share({text:txt}); } catch(e){} return; }
  try { await navigator.clipboard.writeText(txt); toast('Texto copiado'); }
  catch(e){ toast('No se pudo copiar. Selecciona el texto y cópialo.'); }
}
function exportData(){
  const blob = new Blob([JSON.stringify(DB, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  const p = P();
  a.href = URL.createObjectURL(blob);
  a.download = `plan-futbol-${(p ? p.name : 'respaldo').toLowerCase().replace(/[^a-z0-9]+/g,'-')}-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('Respaldo descargado');
}
function importFile(file){
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const d = JSON.parse(fr.result);
      if (!d || typeof d.profiles !== 'object') throw new Error('formato');
      let n = 0;
      Object.values(d.profiles).forEach(pr => { if (pr && pr.id && pr.pos && pr.level){ pr.logs = pr.logs || {}; pr.tests = pr.tests || {}; DB.profiles[pr.id] = pr; n++; } });
      if (!n) throw new Error('vacío');
      if (!P()) DB.active = d.active && DB.profiles[d.active] ? d.active : Object.keys(DB.profiles)[0];
      save(); render(); toast(`Respaldo cargado: ${n} ${n===1?'perfil':'perfiles'}`);
    } catch(e){ toast('Ese archivo no es un respaldo de esta app.'); }
  };
  fr.readAsText(file);
}

/* ----- Reloj de descanso ----- */
const T = {end:0, total:0, int:null, ctx:null};
function beep(){
  try {
    const ctx = T.ctx; if (!ctx) return;
    [0, .22, .44].forEach(o => {
      const os = ctx.createOscillator(), g = ctx.createGain();
      os.frequency.value = 880; os.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.0001, ctx.currentTime + o);
      g.gain.exponentialRampToValueAtTime(.25, ctx.currentTime + o + .02);
      g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + o + .18);
      os.start(ctx.currentTime + o); os.stop(ctx.currentTime + o + .2);
    });
  } catch(e){}
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}
function startTimer(sec){
  try { T.ctx = T.ctx || new (window.AudioContext || window.webkitAudioContext)(); if (T.ctx.state === 'suspended') T.ctx.resume(); } catch(e){}
  T.total = sec; T.end = Date.now() + sec*1000;
  const el = $('#timer'); el.hidden = false; el.classList.remove('fin'); document.body.classList.add('timing');
  $('#t-lab').textContent = 'Descanso';
  clearInterval(T.int); T.int = setInterval(tick, 250); tick();
}
function tick(){
  const left = Math.max(0, Math.ceil((T.end - Date.now())/1000));
  $('#t-num').textContent = `${Math.floor(left/60)}:${pad(left%60)}`;
  $('#t-bar i').style.width = `${T.total ? (left/T.total)*100 : 0}%`;
  if (left <= 0){
    clearInterval(T.int); T.int = null;
    const el = $('#timer'); el.classList.add('fin'); $('#t-lab').textContent = 'A la siguiente serie';
    beep();
    setTimeout(() => { if (!T.int){ el.hidden = true; document.body.classList.remove('timing'); } }, 4000);
  }
}
function stopTimer(){ clearInterval(T.int); T.int = null; $('#timer').hidden = true; document.body.classList.remove('timing'); }

/* ----- Pantalla encendida ----- */
async function toggleWake(){
  try {
    if (S.wake){ await S.wake.release(); S.wake = null; }
    else { S.wake = await navigator.wakeLock.request('screen'); S.wake.addEventListener('release', () => { S.wake = null; }); }
  } catch(e){ toast('Este teléfono no permite mantener la pantalla encendida.'); S.wake = null; }
  render();
}
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && S.wakeWanted && !S.wake){ try { S.wake = await navigator.wakeLock.request('screen'); } catch(e){} }
});

/* ===================== Eventos ===================== */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]');
  if (!t){ if (e.target.id === 'sheet') closeSheet(); return; }
  const a = t.dataset.a, p = P();
  switch (a){
    case 'tab': S.tab = t.dataset.t; if (S.tab === 'hoy') S.sel = S.sel || todayISO(); render(); scrollTo(0,0); if (S.tab === 'equipo'){ loadTeam(); flush(); } break;
    case 'day': S.sel = t.dataset.d; S.tab = 'hoy'; render(); scrollTo(0,0); break;
    case 'wk': S.sel = iso(addDays(parse(S.sel), 7 * +t.dataset.n)); render(); break;
    case 'today': S.sel = todayISO(); render(); break;
    case 'box': toggleBox(p, t); break;
    case 'timer': startTimer(+t.dataset.s); break;
    case 't-add': T.end += 15000; T.total += 15; if (!T.int){ $('#timer').classList.remove('fin'); T.int = setInterval(tick, 250); } tick(); break;
    case 't-stop': stopTimer(); break;
    case 'ex': openEx(t.dataset.id); break;
    case 'close': closeSheet(); break;
    case 'ready': setReady(p, t.dataset.f, +t.dataset.v); break;
    case 'rpe': setRpe(p, +t.dataset.v); break;
    case 'save': saveSession(p, t.dataset.type); break;
    case 'pick': S.setup[t.dataset.f] = t.dataset.v; S.err = ''; render(); break;
    case 'create': createProfile(); break;
    case 'cancel-setup': S.adding = false; S.setup = null; S.err = ''; render(); break;
    case 'profile': openSheet(profileSheet(p)); break;
    case 'save-profile': saveProfile(p); break;
    case 'switch': DB.active = t.dataset.id; save(); closeSheet(); S.sel = todayISO(); render(); toast(`Hola, ${P().name}`); break;
    case 'add-profile': closeSheet(); S.adding = true; S.setup = newDraft(); render(); scrollTo(0,0); break;
    case 'del-profile':
      if (!S.delArm){ S.delArm = true; t.textContent = 'Toca otra vez para borrar todo'; return; }
      deleteProfile(p); break;
    case 'goto-tests': S.tab = 'progreso'; render(); setTimeout(() => { const el = $('#tests'); if (el) el.scrollIntoView({behavior:'smooth'}); }, 60); break;
    case 'share': share(p, t.dataset.m); break;
    case 'team-refresh': loadTeam(true); flush(); toast('Actualizando…'); break;
    case 'flush': flush(true); break;
    case 'sync-save': saveSyncCfg(); break;
    case 'export': exportData(); break;
    case 'import': $('#imp').click(); break;
    case 'wake': S.wakeWanted = !S.wake; toggleWake(); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target, p = P();
  if (t.dataset.tog === 'light'){ const L = getLog(p, S.sel, true); L.light = t.checked; L.lightTouched = true; save(); render(); }
  else if (t.dataset.tog === 'comp'){ const L = getLog(p, S.sel, true); L.comp = t.checked; save(); render(); }
  else if (t.dataset.test){ setTest(p, t.dataset.test, t.dataset.col, t.value); render(); }
  else if (t.id === 'imp'){ importFile(t.files[0]); t.value = ''; }
  else if (t.dataset.su){ S.setup[t.dataset.su] = t.type === 'checkbox' ? t.checked : t.value; }
});
document.addEventListener('input', e => {
  const t = e.target, p = P();
  if (t.dataset.su && t.type !== 'checkbox') S.setup[t.dataset.su] = t.value;
  else if (t.dataset.log){ const L = getLog(p, S.sel, true); L[t.dataset.log] = t.type === 'number' ? (t.value === '' ? null : +t.value) : t.value; save(); }
  else if (t.id === 'exsearch'){
    const q = t.value.trim().toLowerCase();
    document.querySelectorAll('#lib li').forEach(li => { li.hidden = q && !li.dataset.name.includes(q); });
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
window.addEventListener('online', () => flush());
window.addEventListener('storage', e => { if (e.key === KEY){ DB = load(); render(); } });

render();
flush();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
